# Plastanno — runtime environment (dependencies only; the tool itself is
# obtained by `git clone`).
#
#   conda env create -f environment.yml
#   conda activate plastanno
#   bash scripts/get_database.sh        # REQUIRED before the first run (~266 MB)
#
# `channels:` lists conda-forge before bioconda (the order Bioconda requires, so
# conda-forge keeps the higher priority) and ends with `nodefaults` so the
# Anaconda `defaults` channel is never pulled (avoids the Terms-of-Service prompt
# on recent conda). tRNAscan-SE is required, not optional: the default
# --trna-mode is `hybrid`.
name: plastanno
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - biopython
  - pandas
  - matplotlib        # circular plastome map (default output)
  - platformdirs      # cross-platform data dir for the downloaded database
  - numpy             # cost matrix for the cross-engine assignment
  - scipy             # scipy.optimize.linear_sum_assignment, reconcile step 5
  - blast             # makeblastdb / blastn / tblastn
  - exonerate
  - hmmer             # hmmsearch / nhmmer
  - aragorn
  - trnascan-se       # REQUIRED: the default --trna-mode is `hybrid`, and
                      # pipeline.run checks for the binary before step 1
