# Plastanno v2 — runtime environment (dependencies only; the tool itself is
# obtained by `git clone`).
#
#   conda env create -f environment.yml
#   conda activate plastanno
#   bash scripts/get_database.sh        # REQUIRED before the first run (~266 MB)
#
# `channels:` is pinned to bioconda + conda-forge so the Anaconda `defaults`
# channel is never pulled (avoids the Terms-of-Service prompt on recent conda).
# To also use the optional --trnascan source, uncomment trnascan-se below.
name: plastanno
channels:
  - bioconda
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - biopython
  - pandas
  - matplotlib        # circular plastome map (default output)
  - platformdirs      # cross-platform data dir for the downloaded database
  - blast             # makeblastdb / blastn / tblastn
  - exonerate
  - hmmer             # hmmsearch / nhmmer
  - aragorn
  # - trnascan-se     # optional: extra tRNA source used by `--trnascan`
